<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 法雷奥人工智能挑战赛 - 评委期望提交</title>
    <script src="https://cdn.goeasy.io/goeasy-2.8.8.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #04070b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(13, 39, 24, 0.8) 0%, #04070b 60%),
                linear-gradient(rgba(91, 251, 44, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(91, 251, 44, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .slash-deco {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .slash-deco span {
            display: block;
            width: 8px;
            height: 18px;
            background: #5bfb2c;
            transform: skewX(-30deg);
            box-shadow: 0 0 10px rgba(91, 251, 44, 0.6);
        }

        .header { text-align: center; margin-bottom: 30px; width: 100%; }
        .sub-logo { 
            font-size: 12px; 
            letter-spacing: 2px; 
            color: #5bfb2c; 
            font-weight: 700; 
            text-transform: uppercase; 
            margin-bottom: 12px;
            text-shadow: 0 0 8px rgba(91, 251, 44, 0.5);
        }
        .title-cn { 
            font-size: 26px; 
            font-weight: 900; 
            color: #fff; 
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .title-en { 
            font-size: 13px; 
            color: #a0aec0; 
            letter-spacing: 1px; 
            text-transform: uppercase;
        }

        .form-card {
            width: 100%;
            max-width: 420px;
            background: rgba(6, 12, 18, 0.85);
            border: 1px solid rgba(91, 251, 44, 0.25);
            border-radius: 12px;
            padding: 30px 24px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(91, 251, 44, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .form-card::before, .form-card::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid #5bfb2c;
        }
        .form-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
        .form-card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }

        .label-cn { font-size: 16px; font-weight: 700; color: #5bfb2c; margin-bottom: 6px; display: block; letter-spacing: 0.5px; }
        .label-en { font-size: 11px; color: #718096; margin-bottom: 18px; display: block; }
        
        .input-group { position: relative; margin-bottom: 24px; }
        
        /* 替换成 textarea 样式，并实现高度自适应 */
        textarea {
            width: 100%;
            padding: 16px 18px;
            font-size: 17px;
            font-family: inherit; /* 继承字体 */
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            resize: none; /* 禁止手动拖动改变大小 */
            min-height: 56px; /* 保持原始单行高度 */
            line-height: 1.5;
            overflow-y: hidden; /* 隐藏滚动条，完全靠自动增高 */
        }
        textarea::placeholder { color: rgba(255, 255, 255, 0.2); font-size: 15px; }
        textarea:focus { 
            border-color: #5bfb2c; 
            background: rgba(91, 251, 44, 0.05);
            box-shadow: 0 0 15px rgba(91, 251, 44, 0.2), inset 0 0 10px rgba(91, 251, 44, 0.1); 
        }
        
        button {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #5bfb2c 0%, #00ab30 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(91, 251, 44, 0.3);
            transition: all 0.3s ease;
        }
        button:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(91, 251, 44, 0.4);
        }
        button::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.5s;
        }
        button:hover::after { left: 100%; }

        .footer { 
            text-align: center; 
            font-size: 12px; 
            color: #4a5568; 
            line-height: 1.8; 
            margin-top: 40px;
            letter-spacing: 0.5px;
        }
        .footer span { color: #5bfb2c; font-weight: 600; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(6, 18, 10, 0.95);
            border: 1px solid #5bfb2c;
            color: #fff;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(91, 251, 44, 0.3);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast::before {
            content: '✓';
            color: #5bfb2c;
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="slash-deco"><span></span><span></span><span></span></div>
        <div class="sub-logo">Valeo | 漕河泾AI加速器</div>
        <div class="title-cn">2026 法雷奥中国区人工智能挑战赛</div>
        <div class="title-en">China AI Challenge</div>
    </div>

    <div class="form-card">
        <label class="label-cn">请写下对今天大赛的 1 个期望词</label>
        <label class="label-en">Enter your expectation word for today's contest</label>
        
        <div class="input-group">
            <!-- 这里变成了 textarea，移除了 maxlength 限制，改为自适应 -->
            <textarea id="wordInput" placeholder="例如：落地 / 真价值 / 颠覆" rows="1" autocomplete="off"></textarea>
        </div>
        
        <button onclick="submitWord()">提交至大屏 / Submit</button>
    </div>

    <div class="footer">
        从学到用，打造你的<span>AI智能助理</span><br>
        From Learning to Application: Building Your AI Assistant
    </div>

    <div id="toast" class="toast">提交成功！已发送至大屏</div>

    <script>
        const goeasy = GoEasy.getInstance({
            host: "hangzhou.goeasy.io",
            appkey: "BC-57a1ffbd3efe46e68ad1e5e06cdbbd4b",
            modules: ['pubsub']
        });
        goeasy.connect({});

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 【新功能】输入框高度自动适应
        const tx = document.getElementById('wordInput');
        tx.addEventListener('input', function() {
            this.style.height = 'auto'; // 先重置高度
            this.style.height = (this.scrollHeight) + 'px'; // 根据内容撑开高度
        });

        function submitWord() {
            const val = document.getElementById('wordInput').value.trim();
            if(!val) {
                showToast("请输入你的期望词哦~");
                return;
            }

            const btn = document.querySelector('button');
            btn.innerText = '发送中...';
            btn.style.opacity = '0.7';

            goeasy.pubsub.publish({
                channel: "judge_words",
                message: val,
                onSuccess: () => {
                    showToast("提交成功！已发送至大屏");
                    const input = document.getElementById('wordInput');
                    input.value = '';
                    input.style.height = '56px'; // 提交后恢复初始高度
                    btn.innerText = '提交至大屏 / Submit';
                    btn.style.opacity = '1';
                },
                onFailed: (error) => {
                    showToast("网络异常，请重试");
                    btn.innerText = '提交至大屏 / Submit';
                    btn.style.opacity = '1';
                }
            });
        }
        
        // 优化回车键：输入英文长句子时，回车用来换行；如果要提交，按 Ctrl+Enter 或者点击按钮
        document.getElementById('wordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
                // 如果是手机键盘，回车通常是换行（因为输入长句子需要换行）
                // 如果想支持手机端直接回车提交，可以把下面这行去掉注释：
                // e.preventDefault(); submitWord();
            }
        });
    </script>
</body>
</html>
